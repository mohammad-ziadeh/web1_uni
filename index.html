<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/style.css">
    <title>Document</title>

    <style>
        body {
            font-family: 'DMMono-Regular', sans-serif;
            background-color: #fff1e0;
            color: #29241e;
            display: grid;
            grid-template-columns: 15% 1fr;
            grid-template-rows: 7% 1fr 15%;
            grid-template-areas:
                "sidebar header"
                "sidebar body"
                "sidebar footer";
        }




        .sidebar {
            grid-area: sidebar;
            display: grid;
            min-height: 100vh;
            grid-template-rows: 10% 1fr 15%;
            grid-template-areas:
                "side-header"
                "side-body"
                "side-footer";
            border-right: 1px solid rgba(128, 128, 128, 0.288);
        }

        .sidebar-logo {
            grid-area: side-header;
            display: flex;
            margin: auto;
            border-bottom: 1px solid rgba(128, 128, 128, 0.288);
            width: 80%;
        }

        .logo {
            width: 120px;
            margin: 0 0 20px 0;
        }

        .words {
            margin-left: 10px;
        }

        .word-top {
            font-family: Fraunces-Italic;
            font-weight: 500;
            color: #c55c2f;
            margin-bottom: -20px;
        }

        .word-bottom {
            font-family: Fraunces-Variables;
            font-weight: 600;
            display: flex;
        }


        .sidebar-nav {
            grid-area: side-body;
        }

        .sidebar-list {
            width: 80%;
            list-style-type: none;
            margin-left: -20px;
        }

        .sidebar-list li {
            font-family: DMMono-Medium;
            letter-spacing: -0.7px;
            cursor: pointer;
            font-size: medium;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0 2px 15px;
            margin-bottom: 10px;
            color: #5a5856b7;
            width: 100%;
            height: 35px;
            border-radius: 7px;
            transition: all 0.3s ease-in-out;
        }

        .sidebar-list li:hover {
            background-color: #ffffff;
            color: #000000b7;
        }


        .nav-footer {
            grid-area: side-footer;
            margin-bottom: 0px;
            margin: auto;
            border-top: 1px dashed rgba(128, 128, 128, 0.288);
            width: 80%;
        }

        .nav-footer p {
            text-transform: uppercase;
            color: rgba(128, 128, 128, 0.61);
            font-size: small;
        }




        .header {
            grid-area: header;
            margin-left: 30px;
            margin-top: 10px;
        }

        .quick-links {
            display: flex;
            gap: 15px;
            color: rgba(128, 128, 128, 0.507);
            cursor: pointer;
        }


        .quick-links div {
            text-transform: uppercase;
            font-size: small;
            transition: all 0.3s ease-in-out;
        }

        .quick-links div:hover {
            color: #000000b7;
        }


        .title {
            display: flex;

        }

        .title div:nth-child(1) {
            font-family: Fraunces-Variables;
            font-size: xx-large;
        }

        .title div:nth-child(2) {
            margin-left: 8px;
            font-family: Fraunces-Italic;
            font-size: xx-large;
            color: #b9542a;
        }



        .header-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-right: 30px;
        }

        .header-buttons {

            display: flex;
            gap: 15px;
        }

        .header-buttons button {
            font-family: DMMono-Medium;
            padding: 8px 12px 8px 12px;
            border-radius: 20px;
        }

        .header-buttons button:nth-child(1) {
            background-color: #fff1e0;
            border: 1px solid #29241ec0;
            transition: all 0.3s ease-in-out;
        }

        .header-buttons button:nth-child(1):hover {
            background-color: #29241e;
            border: 1px solid #29241e83;
            color: #fff1e0;
        }

        .header-buttons button:nth-child(2) {
            background-color: #29241e;
            color: #fff1e0;
            border: 1px solid #29241e;
            transition: all 0.3s ease-in-out;
        }

        .header-buttons button:nth-child(2):hover {
            background-color: #29241ee8;
            border: 1px solid #29241ee8;
        }
    </style>
</head>

<body>
    <section class="sidebar">
        <div class="sidebar-logo">
            <img class="logo" src="assets/images/logo.svg" alt="sun-logo">
        </div>
        <div class="horizontal-line"></div>


        <div class="sidebar-nav">
            <ul class="sidebar-list">
                <li>
                    <img height="25px" src="assets/images/icon-bed.svg" alt="bed-icon">
                    Your stay
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-house.svg" alt="bed-icon">
                    The house
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-pin.svg" alt="bed-icon">
                    Around town
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-breakfast-outline.svg" alt="bed-icon">
                    Breakfast
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-mail.svg" alt="bed-icon">
                    Messages
                </li>
            </ul>
        </div>

        <div class="nav-footer">
            <p>est. 1987</p>
            <p>maison soleil . 12 rue des<br>oliviers . cassis</p>
            <p>&copy; 2026 maison soleil</p>

        </div>
    </section>
    <main>
        <div class="header">
            <div class="quick-links">
                <div>Booking</div>
                <span>.</span>
                <div>Confirmed</div>
            </div>
            <div class="header-bottom">
                <div class="title">
                    <div>Bienvenue, </div>
                    <div>Lucia</div>
                </div>
                <div class="header-buttons">
                    <button>Print receipt</button>
                    <button>Add to calender</button>
                </div>
            </div>

        </div>
    </main>
</body>

</html>
