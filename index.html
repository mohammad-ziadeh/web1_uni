<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @font-face {
            font-family: 'DMMono-Regular';
            src: url('assets/fonts/dm-mono/DMMono-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'DMMono-Medium';
            src: url('assets/fonts/dm-mono/DMMono-Medium.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'DMSans-Variable';
            src: url('assets/fonts/dm-sans/DMSans-VariableFont_opsz\,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }


        @font-face {
            font-family: 'Fraunces-Italic';
            src: url('assets/fonts/fraunces/Fraunces-Italic-VariableFont_SOFT\,WONK\,opsz\,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: italic;
        }

        @font-face {
            font-family: 'Fraunces-Variables';
            src: url('assets/fonts/fraunces/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: italic;
        }


        body {
            font-family: 'DMMono-Regular', sans-serif;
            background-color: #fff1e0;
            color: #29241e;
        }

        .sidebar {
            display: grid;
            min-height: 100vh;
            grid-template-rows: 10% 1fr 10%;
            grid-template-areas:
                "logo"
                "body"
                "footer";
            width: 15%;
            border-right: 1px solid rgba(128, 128, 128, 0.288);
        }



        .sidebar-logo {
            grid-area: logo;
            display: flex;
            margin: auto;
            border-bottom: 1px solid rgba(128, 128, 128, 0.288);
            width: 80%;
        }

        .words {
            margin-left: 10px;
        }

        .word-top {
            font-family: Fraunces-Italic;
            font-weight: 500;
            color: #c55c2f;
            margin-bottom: -20px;
        }

        .word-bottom {
            font-family: Fraunces-Variables;
            font-weight: 600;
            display: flex;
        }


        .sidebar-nav {
            grid-area: body;
        }

        .sidebar-list {
            width: 80%;
            list-style-type: none;
            margin-left: -20px;
        }

        .sidebar-list li {
            font-family: DMMono-Medium;
            letter-spacing: -0.7px;
            cursor: pointer;
            font-size: medium;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0 5px 15px;
            margin-bottom: 10px;
            color: #5a5856b7;
            width: 100%;
            height: 35px;
            border-radius: 7px;
            transition: all 0.3s ease-in-out;
        }

        .sidebar-list li:hover {
            background-color: #ffffff;
            color: #000000b7;
        }


        .nav-footer {
            grid-area: footer;
            margin-bottom: 0px;
            margin: auto;
            border: 1px dashed rgba(128, 128, 128, 0.288);
            width: 80%;
        }
    </style>
</head>

<body>
    <section class="sidebar">
        <div class="sidebar-logo">
            <img width="120px" src="assets/images/logo.svg" alt="sun-logo">
        </div>
        <div class="horizontal-line"></div>


        <div class="sidebar-nav">
            <ul class="sidebar-list">
                <li>
                    <img height="25px" src="assets/images/icon-bed.svg" alt="bed-icon">
                    Your stay
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-house.svg" alt="bed-icon">
                    The house
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-pin.svg" alt="bed-icon">
                    Around town
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-breakfast-outline.svg" alt="bed-icon">
                    Breakfast
                </li>
                <li>
                    <img height="25px" src="assets/images/icon-mail.svg" alt="bed-icon">
                    Messages
                </li>
            </ul>
        </div>

        <div class="nav-footer">

        </div>
    </section>
</body>

</html>
